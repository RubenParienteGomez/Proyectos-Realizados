<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Marcas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin/adminStyles.css}">
</head>
<body>
<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
            <li>&nbsp;/ Marcas</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-white">Gestión de <span class="neon-blue">Marcas</span></h2>
        <a th:href="@{/admin/marcas/new}" class="btn btn-neon">
            <i class="bi bi-plus-lg"></i> Nueva Marca
        </a>
    </div>

    <div class="card card-gaming shadow">
        <table class="table table-gaming table-hover align-middle mb-0">
            <thead>
            <tr>
                <th class="ps-4">ID</th>
                <th>Nombre</th>
                <th class="text-center">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="m : ${marcas}">
                <td class="ps-4" th:text="${m.id}">1</td>
                <td th:text="${m.nombre}" class="fw-bold">Marca</td>
                <td class="text-center">
                    <a th:href="@{/admin/marcas/{id}/edit(id=${m.id})}" class="btn btn-sm btn-outline-warning me-1" title="Editar"><i class="bi bi-pencil-square"></i></a>
                    <a th:href="@{/admin/marcas/{id}/delete(id=${m.id})}" class="btn btn-sm btn-outline-danger" title="Borrar"><i class="bi bi-trash"></i></a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
