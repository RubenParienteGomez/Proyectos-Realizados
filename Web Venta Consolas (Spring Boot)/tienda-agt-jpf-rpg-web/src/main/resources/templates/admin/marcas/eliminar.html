<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Borrar Marca - ModeGaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/adminStyles.css}">
    <link rel="stylesheet" th:href="@{/css/admin/deleteStyles.css}">
</head>
<body>
<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="fw-bold display-5">
            <span class="admin-text">ADMIN</span>
            <span class="neon-blue"> MODEGAMING</span>
        </h1>
        <p class="text-secondary">Panel de control y gestión de inventario</p>
    </div>
    <div th:if="${error}" class="alert alert-danger bg-dark text-danger border-danger shadow-sm mb-4">
        <strong class="me-2">⚠️ Error:</strong>
        <span th:text="${error}">Error</span>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card card-delete p-5 text-center shadow">

                <h3 class="fw-bold mb-3 text-white">¿ELIMINAR MARCA?</h3>

                <p class="text-secondary mb-4">
                    Estás a punto de borrar permanentemente la marca: <br>
                    <span class="neon-blue fs-4 fw-bold" th:text="${marca.nombre}">Nombre de la Marca</span>
                </p>

                <form th:action="@{/admin/marcas/{id}/delete(id=${marca.id})}" method="post">
                    <div class="d-flex justify-content-center gap-3">
                        <button type="submit" class="btn btn-danger-gaming px-5">ELIMINAR</button>
                        <a th:href="@{/admin/marcas}" class="btn btn-outline-secondary px-4">CANCELAR</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
