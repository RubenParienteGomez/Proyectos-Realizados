<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/admin/adminStyles.css}">
</head>
<body>
<div class="container py-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/admin}">Admin</a></li>
            <li>&nbsp;/ Productos</li>
        </ol>
    </nav>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-white">Gestión de <span class="neon-blue">Productos</span></h2>
        <a th:href="@{/admin/productos/new}" class="btn btn-neon">
            <i class="bi bi-plus-lg"></i> Nuevo Producto
        </a>
    </div>

    <div class="card card-gaming shadow">
        <div class="table-responsive">
            <table class="table table-gaming table-hover align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-4">Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Marca</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td class="ps-4 font-monospace text-neon-blue" th:text="${p.codigo}">000</td>
                    <td th:text="${p.nombre}" class="fw-bold">Producto</td>
                    <td th:text="${p.precio} + '€'">0.00€</td>
                    <td th:text="${p.marca != null ? p.marca.nombre : '---'}">Marca</td>
                    <td class="text-center">
                        <a th:href="@{/admin/productos/{id}/edit(id=${p.id})}" class="btn btn-sm btn-outline-warning me-1" title="Editar"><i class="bi bi-pencil-square"></i></a>
                        <a th:href="@{/admin/productos/{id}/delete(id=${p.id})}" class="btn btn-sm btn-outline-danger" title="Borrar"><i class="bi bi-trash"></i></a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
