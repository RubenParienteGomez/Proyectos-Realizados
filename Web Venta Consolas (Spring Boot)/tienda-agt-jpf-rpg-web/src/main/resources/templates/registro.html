<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registro - ModeGaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/adminStyles.css}">
    <link rel="stylesheet" th:href="@{/css/admin/formStyles.css}">
</head>
<body class="bg-dark">
<div class="container py-5">
    <div class="text-center mb-5">
        <h1 class="fw-bold display-5">
            <span class="admin-text">REGISTRO</span>
            <span class="neon-blue"> MODEGAMING</span>
        </h1>
        <p class="text-secondary">Únete a la comunidad gaming más grande</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div th:if="${error}" class="alert alert-danger bg-dark text-danger border-danger shadow-sm mb-4">
                <strong class="me-2">⚠️ Error:</strong>
                <span th:text="${error}">Error</span>
            </div>

            <div class="card card-gaming p-4 shadow">
                <form th:action="@{/register}" th:object="${usuarioRegistroDto}" method="post">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label text-white">Nombre</label>
                            <input type="text" th:field="*{nombre}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{nombre}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label text-white">Apellidos</label>
                            <input type="text" th:field="*{apellidos}" class="form-control"
                                   th:classappend="${#fields.hasErrors('apellidos')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{apellidos}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-white">Correo Electrónico</label>
                            <input type="email" th:field="*{email}" class="form-control" placeholder="ejemplo@gaming.com"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label text-white">Contraseña</label>
                            <input type="password" th:field="*{password}" class="form-control"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{password}"></div>
                        </div>

                        <div class="col-12 mt-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" th:field="*{aceptoTerminos}" id="checkTerminos"
                                       th:classappend="${#fields.hasErrors('aceptoTerminos')} ? 'is-invalid' : ''">
                                <label class="form-check-label text-secondary" for="checkTerminos">
                                    Acepto los términos de uso y la política de privacidad de ModeGaming.
                                </label>
                                <div class="invalid-feedback" th:errors="*{aceptoTerminos}"></div>
                            </div>
                        </div>
                    </div>

                    <div class="mt-4 d-grid">
                        <button type="submit" class="btn btn-neon btn-lg">CREAR CUENTA</button>
                    </div>

                    <div class="mt-3 text-center">
                        <span class="text-secondary small">¿Ya tienes cuenta? </span>
                        <a th:href="@{/login}" class="neon-blue small text-decoration-none">Inicia sesión</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
