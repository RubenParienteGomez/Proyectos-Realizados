<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - ModeGaming</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin/adminStyles.css}">
</head>
<body class="bg-dark">
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="text-center mb-4">
                <h2 class="text-white fw-bold">LOGIN <span class="neon-blue">MODEGAMING</span></h2>
            </div>

            <div th:if="${param.registrado}" class="alert alert-success bg-dark text-success border-success">
                ¡Registro completado! Ya puedes iniciar sesión.
            </div>

            <div th:if="${param.error}" class="alert alert-danger bg-dark text-danger border-danger">
                Email o contraseña incorrectos.
            </div>

            <div class="card card-gaming p-4 shadow">
                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-white">Email</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white">Contraseña</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-neon w-100">ENTRAR</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
